name: codecov

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -el {0}   # login shell so the conda env is active in every step

    steps:
    - uses: actions/checkout@v6
    - name: Set up conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: '3.14'
        channels: conda-forge
        channel-priority: strict
        activate-environment: test
    - name: Install GPAW from conda-forge
      run: |
        conda install -y "gpaw>=26" pytest pytest-cov
        python -c "import gpaw; print('GPAW', gpaw.__version__)"
    - name: Install the python project
      run: pip install ".[default,tests,symmetry,parallel,fftw]"
    - name: Test with pytest, generate coverage report
      run: |
        pytest tests/test_*.py --serial --cov=./wannierberri --cov-config=pyproject.toml --cov-report=xml:coverage.xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}